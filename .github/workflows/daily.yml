name: daily-politics-post

# 문구는 회사 PC(Claude Code 구독)가 06:40에 써서 올린다 → 여기서는 Claude를 부르지 않는다.
# 여기서 하는 일: 저장된 문구(content.json)로 카드·릴스 만들기 → 인스타 게시.

on:
  schedule:
    - cron: "17 22 * * *"   # 매일 07:17 KST (UTC 22:17)
  push:                     # 회사 PC가 '추가 게시' 문구(날짜_2 폴더)를 올리면 바로 게시
    paths:
      - "posts/*/*_*/content.json"
  workflow_dispatch:
    inputs:
      post_date:
        description: "게시할 문구 폴더(예: 2026-11-11_2). 비우면 오늘"
        default: ""
      dry_run:
        description: "true면 이미지만 만들고 게시 안 함"
        default: "false"
      channel:
        description: "right / left / all"
        default: "all"
      compare_date:
        description: "개선 전후 비교 이미지를 만들 날짜(예: 2026-11-11). 비우면 안 만듦"
        default: ""

permissions:
  contents: write

concurrency: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1          # 같은 repo에 push 하므로 순서대로
      fail-fast: false         # 한 채널이 실패해도 다른 채널은 진행
      matrix:
        include:
          - channel: right
            token: IG_ACCESS_TOKEN_RIGHT
            user: IG_USER_ID_RIGHT
          - channel: left
            token: IG_ACCESS_TOKEN_LEFT
            user: IG_USER_ID_LEFT
    env:
      RUN_ME: ${{ github.event.inputs.channel == '' || github.event.inputs.channel == 'all' || github.event.inputs.channel == matrix.channel }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_ME == 'true'

      - uses: actions/setup-python@v5
        if: env.RUN_ME == 'true'
        with:
          python-version: "3.12"

      - name: 준비(프로그램 설치)
        if: env.RUN_ME == 'true'
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          pip install -q -r requirements.txt
          TODAY=$(TZ=Asia/Seoul date +%F)
          CH=${{ matrix.channel }}
          if [ -n "${{ github.event.inputs.post_date }}" ]; then
            DAY="${{ github.event.inputs.post_date }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            DAY=$(ls -d posts/$CH/${TODAY}_* 2>/dev/null | sort -V | tail -1 | xargs -r basename)
            [ -z "$DAY" ] && echo "SKIP=1" >> $GITHUB_ENV
          else
            DAY=$TODAY
          fi
          echo "DAY=$DAY" >> $GITHUB_ENV
          echo "POST_DATE=$DAY" >> $GITHUB_ENV
          echo "게시 대상: $DAY"

      - name: 개선 전후 비교 이미지
        if: env.RUN_ME == 'true' && github.event.inputs.compare_date != ''
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python compare.py --channel ${{ matrix.channel }} --date ${{ github.event.inputs.compare_date }}

      - name: 카드·릴스 만들기 → 게시
        if: env.RUN_ME == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets[matrix.token] }}
          IG_USER_ID: ${{ secrets[matrix.user] }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          # 전환 기간 안전장치: PC 문구가 없을 때만 API로 대신 작성. Secret을 지우면 API 요금 0원 확정
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          CH=${{ matrix.channel }}
          [ "$SKIP" = "1" ] && { echo "이 채널은 추가 게시 문구 없음"; exit 0; }

          set +e
          python main.py --channel $CH --from-saved
          code=$?
          if [ "$code" = "3" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
            python notify.py "⚠️ [$CH] 회사 PC 문구가 없어 API로 대신 작성합니다(요금 발생). PC 06:40 작업을 확인해 주세요."
            python main.py --channel $CH
            code=$?
          elif [ "$code" = "3" ]; then
            python notify.py "⚠️ [$CH] 오늘($DAY) 문구가 안 올라와서 게시를 건너뜀. 회사 PC(06:40 작업)를 확인해 주세요."
            exit 0
          fi
          set -e
          [ "$code" = "0" ] || exit $code

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run → 게시·저장 안 함 (아래 Artifacts에서 카드·릴스 확인)"
            exit 0
          fi

          python media_push.py --channel $CH
          git add posts/$CH/$DAY/*.json posts/$CH/$DAY/*.txt
          [ -d photos ] && git add photos
          git commit -qm "$CH post $DAY" || true
          git pull -q --rebase --autostash -X theirs
          git push -q

          python publish_step.py --channel $CH
          git add history_$CH.json
          git commit -qm "$CH history $DAY" || true
          git pull -q --rebase --autostash -X theirs && git push -q

      - name: 실패 알림
        if: failure() && env.RUN_ME == 'true'
        run: python notify.py "❌ [${{ matrix.channel }}] 인스타 게시 실패. GitHub Actions 기록을 확인해 주세요." || true

      - name: 미리보기 파일(Actions 실행 화면 아래 Artifacts에서 다운로드)
        if: always() && env.RUN_ME == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.channel }}
          path: |
            posts/${{ matrix.channel }}/${{ env.DAY }}/*.jpg
            posts/${{ matrix.channel }}/${{ env.DAY }}/reel.mp4
            compare/
          if-no-files-found: ignore
          retention-days: 7
